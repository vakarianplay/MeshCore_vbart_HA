name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".ruff.toml"
      - "pyproject.toml"
      - "requirements*.txt"
      - "hacs.json"
  pull_request:
    branches: [main, master]
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".ruff.toml"
      - "pyproject.toml"
      - "requirements*.txt"
      - "hacs.json"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint (Ruff) + Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff lint
        run: ruff check custom_components tests

      - name: Ruff format check
        run: ruff format --check custom_components tests

      - name: Compile Python (syntax smoke test)
        run: python -m compileall -q custom_components

  tests:
    name: Tests (pytest, if present)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; fi
          pip install pytest

      - name: Run tests (only if tests dir exists)
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory found. Skipping pytest."
          fi
